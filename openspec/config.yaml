schema: spec-driven

context: |
  OpenQuant: Rust implementations of methods from López de Prado, Advances in
  Financial Machine Learning (AFML), in crates/openquant, with PyO3 bindings in
  crates/pyopenquant exposed as the `openquant` Python package (python/openquant).
  Statistics must match the formulas in AFML and the papers it cites, and are
  tested against hand-computed values. Work is tracked as GitHub issues and the
  reviewed work records in .ai-dlc/work/.
