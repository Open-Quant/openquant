[package]
name = "openquant"
version = "0.1.0"
authors = ["seankoval <seanmkoval@gmail.com>"]
edition = "2021"
description = "Rust implementations of methods from Advances in Financial Machine Learning (AFML)"
repository = "https://github.com/Open-Quant/openquant"
homepage = "https://open-quant.github.io/openquant/"
documentation = "https://open-quant.github.io/openquant/"
license = "MIT"
keywords = ["quant", "finance", "trading", "afml", "machine-learning"]
categories = ["finance", "science", "algorithms"]
readme = "../../README.md"

[dependencies]
chrono = "0.4"
itertools = "0.15"
rand = { version = "0.8", features = ["std"] }
statrs = "0.16"
rand_distr = "0.4"
nalgebra = "0.32"
csv = "1"
polars = { version = "0.46", default-features = false, features = ["strings", "lazy"] }
thiserror = "2"

[dev-dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
itertools = "0.15"
criterion = "0.5"

[[bench]]
name = "perf_hotspots"
harness = false

[[bench]]
name = "synthetic_ticker_pipeline"
harness = false

[[bench]]
name = "hpc_parallel_scaling"
harness = false

[[bench]]
name = "streaming_hpc_scaling"
harness = false
