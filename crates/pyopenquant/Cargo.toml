[package]
name = "pyopenquant"
version = "0.1.0"
edition = "2024"
description = "Python bindings for openquant via PyO3"
license = "MIT"
repository = "https://github.com/Open-Quant/openquant"
homepage = "https://open-quant.github.io/openquant/"
readme = "../../README.md"
# Distributed as the `pyopenquant` wheel on PyPI (built by maturin), never as a crate.
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
nalgebra = "0.35"
openquant = { path = "../openquant" }
polars = { version = "0.55", default-features = false }
# No `extension-module` feature: PyO3 deprecates it, and with it the unit tests
# (`cargo test --workspace`) cannot link. maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE
# for the wheel build instead.
pyo3 = "0.29"
pyo3-polars = "0.28"
rand = "0.8"

[package.metadata.maturin]
name = "openquant._core"
