[package]
name = "pyopenquant"
version = "0.1.0"
edition = "2024"
description = "Python bindings for openquant via PyO3"
license = "MIT"
repository = "https://github.com/Open-Quant/openquant"
homepage = "https://open-quant.github.io/openquant/"
readme = "../../README.md"
# Distributed as the `pyopenquant` wheel on PyPI (built by maturin), never as a crate.
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
nalgebra = "0.35"
openquant = { path = "../openquant" }
polars = { version = "0.46", default-features = false }
pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3-polars = "0.20"
rand = "0.8"

[package.metadata.maturin]
name = "openquant._core"
