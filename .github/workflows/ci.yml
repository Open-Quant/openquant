name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious
      - name: Tests (fast)
        run: cargo test --workspace --lib --tests --all-features -- --skip test_sadf_test

  docs-checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # check:examples cargo-checks every documented Rust example against the
      # real crate, so this job needs a toolchain as well as bun.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs-site
      - name: Build docs
        run: bun run build
        working-directory: docs-site
      - name: Check API inventory drift
        run: bun run check:api-drift
        working-directory: docs-site
      - name: Check internal links
        run: bun run check:links
        working-directory: docs-site
      - name: Check content schema
        run: bun run check:content-schema
        working-directory: docs-site
      - name: Check documented Rust examples compile
        run: bun run check:examples
        working-directory: docs-site
