[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyopenquant"
version = "0.1.0"
description = "Rust implementations of methods from Advances in Financial Machine Learning, with Python bindings (import name: openquant)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenQuant contributors" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["polars>=1.0,<2", "pyarrow>=15,<20"]

[project.urls]
Homepage = "https://open-quant.github.io/openquant/"
Documentation = "https://open-quant.github.io/openquant/"
Repository = "https://github.com/Open-Quant/openquant"
Issues = "https://github.com/Open-Quant/openquant/issues"

[tool.maturin]
manifest-path = "crates/pyopenquant/Cargo.toml"
python-source = "python"
module-name = "openquant._core"
features = []

[dependency-groups]
# ruff and mypy are pinned exactly so the CI lint gate and a local run agree.
# nbclient + ipykernel execute the research notebooks in a real Jupyter kernel so
# rich outputs (tables, inline figures) are kept; matplotlib draws the figures.
# Those four are used by `just notebooks-run` and .github/workflows/notebooks.yml only.
dev = [
  "maturin>=1.7,<2.0",
  "pytest>=8,<9",
  "pytest-cov>=5",
  "ruff==0.16.9",
  "mypy==2.3.1",
  # numpy 2.5 needs Python 3.12 and its stubs use `type` statements, which mypy rejects when
  # checking for 3.11 ([tool.mypy] python_version). Keeps the lint environment on 2.4.
  "numpy<2.5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle errors (ruff's defaults), import order and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["python/openquant", "python/tests"]
mypy_path = "python"
warn_unused_ignores = true

# The compiled extension ships no stubs yet; pandas is an optional extra.
[[tool.mypy.overrides]]
module = ["openquant._core", "openquant._core.*", "pandas", "pandas.*"]
ignore_missing_imports = true
