id = "res-real-data-layer"
title = "Build a real market data layer with cache, snapshot hash and recorded terms"
scope = "[research / P0] There is no market data in the repo beyond mlfinlab-style test fixtures, and no fetcher in the package. Notebook 06 scrapes Stooq daily closes inline with `urllib`; Stooq's redistribution terms are unchecked (brief H2). `openquant.data` (`load_ohlcv`, `clean_ohlcv`, `align_calendar`, `data_quality_report`) is used by no notebook. Add `openquant.data.fetch`: pluggable source, on-disk parquet cache, content hash recorded in each run's manifest, and a `DATA_SOURCES.md` stating each source's terms. Choose the source (owner decision 3) - candidates to evaluate: a fetch-only adapter where the user supplies their own key, and a small redistributable sample committed for CI. Target universe from the OQ-nbr epic: US equities/ETFs daily OHLCV."
requires_spec = true
spec_reason = "New public Python API and an on-disk cache format."
acceptance = [
    "`fetch(symbols, start, end)` returns a frame that passes `data_quality_report` and is served from cache offline on the second call.",
    "Every run manifest records the dataset hash; changing the data changes the hash.",
    "`DATA_SOURCES.md` records terms for each source; CI uses only data that may be redistributed.",
]
