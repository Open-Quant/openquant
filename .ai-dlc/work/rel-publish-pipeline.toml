schema = 1
id = "rel-publish-pipeline"
title = "Add a tagged release pipeline: wheels, crates.io, changelog"
scope = "[release / P2] No git tags, no GitHub releases, no CHANGELOG. `.github/workflows/release.yml` ('Release Readiness') only lints, tests and runs `cargo package`; there is no wheel build, PyPI upload or crates.io publish. CI builds on one OS and Python 3.11 only. Add: maturin wheel matrix (linux/macos/windows, abi3 or 3.11-3.13), trusted-publishing to PyPI, `cargo publish` for `openquant`, CHANGELOG.md, and a tag-driven workflow. Cut v0.1.0 only after the code-quality and testing slices land."
requires_spec = false
spec_reason = "No observable library behavior changes; this is repository, CI or documentation work verified by the listed checks."
