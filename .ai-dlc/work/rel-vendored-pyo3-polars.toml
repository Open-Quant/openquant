schema = 1
id = "rel-vendored-pyo3-polars"
title = "Document or eliminate the vendored pyo3-polars patch"
scope = "[release / P1] Root `Cargo.toml` has `[patch.crates-io] pyo3-polars = { path = \"vendor/pyo3-polars\" }` (v0.20.0, upstream sha 9b69223, added in d811710). Why it is vendored and what differs from upstream is undocumented. `[patch]` is ignored for crates.io consumers, so `pyopenquant` cannot be built from a registry as is. Diff against upstream; then either drop the patch (upstream release now sufficient), depend on a git rev, or keep it with a `vendor/README.md` explaining the delta and mark `pyopenquant` `publish = false` (wheels only)."
requires_spec = false
spec_reason = "No observable library behavior changes; this is repository, CI or documentation work verified by the listed checks."
acceptance = [
    "The delta to upstream is written down.",
    "A clean checkout builds the wheel with the chosen approach, and `cargo package -p openquant` succeeds without the patch.",
]
reviewed = true
