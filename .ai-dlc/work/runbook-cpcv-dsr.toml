id = "runbook-cpcv-dsr"
title = "Runbook: CPCV backtest with PSR and deflated Sharpe"
scope = "[runbook / P1] Study: take one strategy family with a small parameter grid, backtest with combinatorial purged CV to get a distribution of out-of-sample Sharpe paths rather than one number, then report PSR, DSR deflated by the registered trial count, MinTRL and probability of backtest overfitting. Contrast against a naive walk-forward single-path Sharpe to show the inflation. Existing pieces: `backtesting_engine`, `backtest_stats`, `strategy_risk`; needs the new bindings and evaluation module. Deliver as an executed notebook following the cell contract plus a matching docs-site page. It must state a falsifiable hypothesis up front, use the real data layer, avoid lookahead (signals lagged; verified by a shuffle/shift test), report results net of a stated cost model, and end with an honest promote/reject decision. A rejected hypothesis is an acceptable result."
