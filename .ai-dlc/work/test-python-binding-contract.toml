scope = "[testing / P0] `crates/pyopenquant` registers 27 submodules (159 `add_function` calls) but `python/tests` exercise only the original 9. The 17 added in 3e5afc9 have no Python tests: fracdiff, volatility, codependence, backtest_stats, sample_weights, microstructural, strategy_risk, ensemble, structural_breaks, synthetic_bt, ef3m, streaming_hpc, hrp, hcaa, onc, cla, sb_bagging. `python/openquant/__init__.py` re-exports 6 of 27; the rest are reachable only via `openquant._core.*`. `pyopenquant` has no Rust unit tests. Note: the local `_core*.so` dated 2026-03-01 exposes 9 submodules - rebuild with `just py-develop` before trusting local results."
