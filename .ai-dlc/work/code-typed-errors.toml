schema = 1
id = "code-typed-errors"
title = "Replace String errors with typed errors across the Rust core"
scope = "[code / P1] ~92 public signatures return `Result<_, String>`: backtesting_engine 21, data_processing 13, ensemble_methods 9, etf_trick 9, hyperparameter_tuning 9, feature_importance 8, fingerprint 7, synthetic_backtesting 6, microstructural_features 5, cross_validation 2, sample_weights 2, ef3m 1. 16 modules have error enums but only 6 implement `std::error::Error` (missing: cla, codependence, hcaa, hrp, onc, portfolio_optimization::AllocError, risk_metrics, sb_bagging, strategy_risk, structural_breaks). The crate does not use `thiserror`. Adopt `thiserror`, give each module an enum, implement Error+Display everywhere, and map them to specific Python exception types in pyopenquant."
requires_spec = true
spec_reason = "Public error types and the Python exceptions raised are observable API behavior."
acceptance = [
    "`grep -rn 'Result<.*, String>' crates/openquant/src` returns nothing.",
    "Every public error enum implements `std::error::Error`; a compile-time test asserts it.",
    "Python raises `ValueError`/module-specific exceptions with the Rust message; tested for at least one function per module.",
]
reviewed = true
depends_on = [
    "code-clippy-clean",
]
requirements = [
    "docs/design/production-readiness-brief.md#RQ-004",
]

