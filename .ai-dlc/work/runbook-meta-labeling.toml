schema = 1
id = "runbook-meta-labeling"
title = "Runbook: triple-barrier labeling and meta-labeling on real data"
scope = "[runbook / P1] Replaces notebook 06, whose 'model' is a 5-day momentum heuristic mapped to fake probabilities, with no triple-barrier call, no CV, no PSR/DSR, a CUSUM threshold of 0.001 giving 845 events on 900 bars, and a possible lookahead (momentum window includes the current bar). Study: CUSUM event sampling with a volatility-scaled threshold -> triple-barrier labels -> a simple primary rule (e.g. moving-average crossover) -> secondary meta-label classifier with sample-uniqueness weights and sequential-bootstrap bagging -> purged k-fold. Compare primary-only vs meta-labeled precision/recall/F1 and Sharpe. Existing pieces: `filters`, `labeling`, `sample_weights`, `sb_bagging`, `bet_sizing`. Deliver as an executed notebook following the cell contract plus a matching docs-site page. It must state a falsifiable hypothesis up front, use the real data layer, avoid lookahead (signals lagged; verified by a shuffle/shift test), report results net of a stated cost model, and end with an honest promote/reject decision. A rejected hypothesis is an acceptable result."
