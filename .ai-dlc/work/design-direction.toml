id = "design-direction"
title = "Set one visual identity: palette, type, logo"
scope = "[design / P0] Three unrelated palettes coexist: the logo is neon magenta `#e44de0`, cyan `#52c8f5`, yellow `#f0e050` with a Gaussian-blur glow on a dark rounded tile; README and docs banners use a purple-to-blue gradient `#1b1648 -> #36257b -> #0d64c8` with pink/teal radial glows; the site accent is muted navy `#0f5f9a`. The docs banner SVG reads 'Ship Smarter / Astro-native docs for quantitative ML systems' and names Space Grotesk, which is never loaded. Body font is Manrope (a marketing face) with `letter-spacing: 0.01em`; headings ask for weight 750, which is not loaded. Produce a design brief (`docs/templates/design-brief.md`) and 2-3 candidate directions evaluated with `docs/templates/design-rubric.md`. Recommended direction: printed reference manual - a text face (IBM Plex Sans or Source Serif 4) with IBM Plex Mono kept, ~70-character measure, white/near-black grounds, one accent taken from the logo and used only for links and focus, a flat logo mark without the glowing tile, radii <= 4px, visible hairlines, no gradients/glows/blur. Reference points: polars, uv/ruff, tokio, scikit-learn docs."
requires_spec = false
spec_reason = "Visual design decision recorded as a design brief and selection; no behavior."
