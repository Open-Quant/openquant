id = "docs-api-reference"
title = "Publish a real API reference for Rust and Python"
scope = "[docs / P1] Each module page's 'API Reference' is a bare list of names - no signatures, types, returns or errors. Nothing links to rustdoc/docs.rs and nothing is generated for Python. Publish `cargo doc` output under `/api/rust/` on the Pages site (docs.rs after release). For Python, generate signatures from the built extension: add `text_signature`/docstrings in pyopenquant and ship `.pyi` stubs, then render a reference section. Extend the existing API-drift gate to fail when a bound function lacks a docstring."
requires_spec = false
spec_reason = "Documentation-only change; behavior is owned by the code and already gated by the docs example checks."
acceptance = [
    "Every public Rust item and every Python function has a rendered signature and description reachable from its module page.",
    "`help(openquant.labeling.triple_barrier_labels)` shows a useful docstring; stubs pass a type checker.",
    "The drift gate fails on an undocumented binding.",
]
reviewed = true
depends_on = [
    "code-rustdoc",
]
requirements = [
    "docs/design/production-readiness-brief.md#RQ-013",
]

