schema = 1
id = "bind-validation-backtest"
title = "Add Python bindings for purged CV, CPCV backtesting, feature importance and tuning"
scope = "[research / P0] No binding files exist for `cross_validation` (PurgedKFold), `backtesting_engine` (CPCV), `feature_importance` (MDI/MDA/SFI) or `hyperparameter_tuning`. These are exactly the AFML pieces a credible study needs, so every runbook is blocked on them. Unverified guess: they are unbound because they take closures/trait objects. Design the Python surface to return index splits and path assignments (so any sklearn estimator can be used) rather than passing Python callables into Rust. PR #27 made label spans mandatory for feature-importance CV - the binding must preserve that. Lower priority modules without bindings (fingerprint, combinatorial_optimization, hpc_parallel, etf_trick) are out of scope here."
requires_spec = true
spec_reason = "New public Python API."
acceptance = [
    "`openquant.cross_validation.purged_kfold_splits(...)` and CPCV path generation return numpy index arrays; tests prove no train index overlaps a test label span and embargo is honored.",
    "Feature importance cannot be called from Python without label spans.",
    "A Python test reproduces the Rust fixture results for each new binding.",
]
reviewed = true
depends_on = [
    "res-recover-stranded-work",
]
requirements = [
    "docs/design/production-readiness-brief.md#RQ-010",
]

