<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1015" width="600" height="1015" role="img" aria-labelledby="title desc">
<title id="title">Three ways a model can use a feature</title>
<desc id="desc">Idealized analytic curves for independent uniform features on [-1,1], not the finite-sample Rust example. Linear centered dependence is 2v. Quadratic dependence is v squared with a constant fitted line at one third. The joint residual vw changes slope with w, although its average over w is zero.</desc>
<rect width="600" height="1015" fill="#fbf9f4"/>
<g font-family="system-ui, sans-serif" font-size="20" fill="#1d1a16">
<text x="24" y="36" font-size="24" fill="#1d1a16" text-anchor="start" font-weight="bold">Three ways a model can use a feature</text>
<text x="24" y="68" font-size="20" fill="#5c554b" text-anchor="start" font-weight="normal">Idealized model: 2x₀ + x₁² + x₀x₂</text>
<text x="24" y="98" font-size="20" fill="#5c554b" text-anchor="start" font-weight="normal">Independent uniform features on [−1, 1].</text>
<text x="24" y="140" font-size="20" fill="#1d1a16" text-anchor="start" font-weight="bold">Linear: centered dependence = 2v</text>
